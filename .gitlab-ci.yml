
stages:          # List of stages for jobs, and their order of execution
  - build-maven
  - security-scanning
  - visualization


include:
  - template: Code-Quality.gitlab-ci.yml
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Dependency-Scanning.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - template: Jobs/License-Scanning.gitlab-ci.yml


# disable the spotbugs and use sempgrep.
variables:
  DS_INCLUDE_DEV_DEPENDENCIES: "false"
  SAST_EXCLUDED_ANALYZERS: gosec,eslint,spotbugs
  DS_JAVA_VERSION: 8

code_quality:
  stage: build-maven
  services:            # Shut off Docker-in-Docker
  tags:
    - cq-sans-dind     # Set this job to only run on our new specialized runner
  artifacts:
    paths: [gl-code-quality-report.json]

sast:
  stage: security-scanning
  needs: ["build-maven-job"]
  tags:
    - cq-sans-dind     # Set this job to only run on our new specialized runner

dependency_scanning:
  stage: security-scanning
  needs: ["build-maven-job"]
  tags:
    - cq-sans-dind     # Set this job to only run on our new specialized runner

.secret-analyzer:
  stage: security-scanning
  needs: ["build-maven-job"]
  tags:
    - cq-sans-dind     # Set this job to only run on our new specialized runner



license_scanning:
  stage: security-scanning
  needs: ["build-maven-job"]
  tags:
    - cq-sans-dind

# This job executes the maven build artefacts .
build-maven-job:
  stage: build-maven
  script:
    - echo "Compiling the code..."
    - mvn clean verify
    - echo "Compile complete."
  after_script:
    - cat target/site/jacoco/index.html | grep -o '<tfoot>.*</tfoot>'
  coverage: '/Total.*?([0-9]{1,3})%/'
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - "target/site"
      - "*/target/site"
    reports:
      junit:
        - "target/surefire-reports/TEST-*.xml"
        - "target/failsafe-reports/TEST-*.xml"
        - "*/target/surefire-reports/TEST-*.xml"
        - "*/target/failsafe-reports/TEST-*.xml"

code-coverage-visualization:
  # Must be in a stage later than build-maven-job's stage.
  stage: visualization
  image: registry.gitlab.com/haynes/jacoco2cobertura:1.0.7
  tags:
    - cq-sans-dind     # Set this job to only run on our new specialized runner
  script:
    # convert report from jacoco to cobertura, using relative project path
    # find all modules containing java source files.
    - mkdir -p target/site/
    - jacoco_paths=`find * -path "**/src/main/java" -type d | sed -e 's@^@'"$CI_PROJECT_DIR"'/@'`
    - echo "jacocopaths -> $jacoco_paths"
    - python /opt/cover2cover.py target/site/jacoco/index.html $jacoco_paths > target/site/cobertura.xml
  needs: ["build-maven-job"]
  dependencies:
    - build-maven-job
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - "target/site"
    reports:
      coverage_report:
        coverage_format: cobertura
        path: target/site/cobertura.xml

